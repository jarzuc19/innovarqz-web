<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gestión de Personal | InnovArqZ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto bg-slate-800 rounded-xl p-8 shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold text-cyan-400 mb-6 border-b border-slate-700 pb-3">
      Administrador de Personal (`personal.json`)
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Lista de Miembros -->
      <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700">
        <h2 class="font-semibold text-slate-300 mb-3">Miembros Guardados</h2>
        <div id="listaMiembros" class="space-y-2"></div>
        <button onclick="nuevoMiembro()" class="mt-4 w-full bg-slate-700 hover:bg-slate-600 text-sm py-2 rounded transition">
          + Agregar Nuevo
        </button>
      </div>

      <!-- Formulario de Edición -->
      <div class="md:col-span-2 space-y-4">
        <input type="hidden" id="memberIndex">
        
        <div>
          <label class="block text-xs text-slate-400 mb-1">ID Único (sin espacios):</label>
          <input type="text" id="memberId" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Nombre Completo:</label>
            <input type="text" id="memberNombre" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Cargo en Ficha Principal:</label>
            <input type="text" id="memberCargoFicha" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Nombre de Imagen (ej: james-zuniga.jpg):</label>
            <input type="text" id="memberImagen" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Subtítulo del Modal:</label>
            <input type="text" id="modalSubtitulo" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Metadatos / Credenciales (separados por coma):</label>
          <input type="text" id="modalMetadatos" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm" placeholder="Licencia CPNAA, Especialista BIM">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Descripción / Perfil Profesional:</label>
          <textarea id="modalPerfilDesc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Formación y Certificaciones (una por línea):</label>
          <textarea id="modalFormacionItems" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Proyectos Vinculados (Formato: ID|Nombre - uno por línea):</label>
          <textarea id="modalProyectos" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm" placeholder="auditorio-tumaco|Auditorio en Tumaco"></textarea>
        </div>

        <div class="flex gap-3 pt-4 border-t border-slate-700">
          <button onclick="guardarMiembro()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-4 py-2 rounded text-sm transition">
            Guardar Miembro
          </button>
          <button onclick="descargarJSON()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded text-sm transition">
            Descargar personal.json
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let personalData = [];

    async function cargarData() {
      try {
        const res = await fetch('personal.json');
        personalData = await res.json();
        renderLista();
      } catch (e) {
        console.warn("Creando nueva estructura de personal.");
        personalData = [];
      }
    }

    function renderLista() {
      const cont = document.getElementById('listaMiembros');
      cont.innerHTML = '';
      personalData.forEach((m, idx) => {
        cont.innerHTML += `
          <div onclick="cargarEnFormulario(${idx})" class="p-2 bg-slate-800 hover:bg-slate-700 rounded cursor-pointer border border-slate-700 text-sm flex justify-between items-center">
            <span class="font-medium">${m.nombre || 'Sin nombre'}</span>
            <button onclick="borrarMiembro(event, ${idx})" class="text-rose-400 hover:text-rose-300 text-xs">x</button>
          </div>
        `;
      });
    }

    function cargarEnFormulario(idx) {
      const m = personalData[idx];
      document.getElementById('memberIndex').value = idx;
      document.getElementById('memberId').value = m.id || '';
      document.getElementById('memberNombre').value = m.nombre || '';
      document.getElementById('memberCargoFicha').value = m.cargoFicha || '';
      document.getElementById('memberImagen').value = m.imagen || '';
      
      const md = m.modalDetalle || {};
      document.getElementById('modalSubtitulo').value = md.subtitulo || '';
      document.getElementById('modalMetadatos').value = (md.metadatos || []).join(', ');
      document.getElementById('modalPerfilDesc').value = md.seccionPerfil?.descripcion || '';
      document.getElementById('modalFormacionItems').value = (md.seccionFormacion?.items || []).join('\n');
      
      const proys = (md.proyectosDestacados || []).map(p => `${p.id}|${p.nombre}`).join('\n');
      document.getElementById('modalProyectos').value = proys;
    }

    function nuevoMiembro() {
      document.getElementById('memberIndex').value = '-1';
      document.getElementById('memberId').value = 'nuevo-miembro';
      document.getElementById('memberNombre').value = 'Nuevo Miembro';
      document.getElementById('memberCargoFicha').value = 'Especialista';
      document.getElementById('memberImagen').value = '';
      document.getElementById('modalSubtitulo').value = '';
      document.getElementById('modalMetadatos').value = '';
      document.getElementById('modalPerfilDesc').value = '';
      document.getElementById('modalFormacionItems').value = '';
      document.getElementById('modalProyectos').value = '';
    }

    function guardarMiembro() {
      const idx = parseInt(document.getElementById('memberIndex').value);
      
      const formacionList = document.getElementById('modalFormacionItems').value
        .split('\n').map(s => s.trim()).filter(Boolean);

      const metadatosList = document.getElementById('modalMetadatos').value
        .split(',').map(s => s.trim()).filter(Boolean);

      const proyectosList = document.getElementById('modalProyectos').value
        .split('\n').map(line => {
          const [id, nombre] = line.split('|');
          return id && nombre ? { id: id.trim(), nombre: nombre.trim() } : null;
        }).filter(Boolean);

      const objetoMiembro = {
        id: document.getElementById('memberId').value,
        nombre: document.getElementById('memberNombre').value,
        cargoFicha: document.getElementById('memberCargoFicha').value,
        imagen: document.getElementById('memberImagen').value,
        modalDetalle: {
          subtitulo: document.getElementById('modalSubtitulo').value,
          metadatos: metadatosList,
          seccionPerfil: {
            titulo: "Perfil Profesional",
            descripcion: document.getElementById('modalPerfilDesc').value
          },
          seccionFormacion: {
            titulo: "Formación & Certificaciones",
            items: formacionList
          },
          proyectosDestacados: proyectosList
        }
      };

      if (isNaN(idx) || idx < 0) {
        personalData.push(objetoMiembro);
      } else {
        personalData[idx] = objetoMiembro;
      }

      renderLista();
      alert("Miembro actualizado en memoria. Recuerda descargar el personal.json para guardar los cambios en el proyecto.");
    }

    function borrarMiembro(e, idx) {
      e.stopPropagation();
      if (confirm("¿Deseas eliminar este perfil?")) {
        personalData.splice(idx, 1);
        renderLista();
      }
    }

    function descargarJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(personalData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "personal.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.onload = cargarData;
  </script>
</body>
</html>
