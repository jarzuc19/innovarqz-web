<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Personal | InnovArqZ</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0b1120;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-cyan: #06b6d4;
            --accent-cyan-hover: #0891b2;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 1000px;
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-title {
            color: var(--accent-cyan);
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }

        /* Sidebar - Lista de Miembros */
        .sidebar-panel {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-add {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-add:hover { background-color: #475569; }

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow-y: auto;
            max-height: 500px;
        }

        .member-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .member-item:hover, .member-item.active {
            border-color: var(--accent-cyan);
            background-color: rgba(6, 182, 212, 0.1);
        }

        /* Formulario */
        .form-panel {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 0.8rem;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent-cyan);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-save {
            background-color: var(--accent-cyan);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-save:hover { background-color: var(--accent-cyan-hover); }

        .btn-download {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-download:hover { background-color: var(--accent-green-hover); }

        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-left: auto;
        }
        
        .btn-delete:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header-title">Administrador de Personal (`personal.json`)</div>
        
        <div class="layout-grid">
            
            <!-- Barra Lateral -->
            <div class="sidebar-panel">
                <div class="sidebar-title">Miembros Guardados</div>
                <button class="btn-add" onclick="nuevoMiembro()">+ Agregar Nuevo</button>
                <div class="member-list" id="listaMiembros">
                    <!-- Los miembros se cargan aquí -->
                </div>
                
                <!-- Input oculto para cargar JSON existente -->
                <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="cargarJSON(event)">
                <button class="btn-add" style="margin-top: auto; background-color: transparent; border: 1px dashed var(--border-color);" onclick="document.getElementById('fileInput').click()">Cargar personal.json existente</button>
            </div>

            <!-- Formulario Principal -->
            <div class="form-panel" id="formularioMiembro">
                <div class="form-group">
                    <label>ID Único (sin espacios):</label>
                    <input type="text" id="m_id" placeholder="ej: james-zuniga">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre Completo:</label>
                        <input type="text" id="m_nombre" placeholder="Ej: Arq. James Ramiro Zúñiga Caipe">
                    </div>
                    <div class="form-group">
                        <label>Cargo en Ficha Principal:</label>
                        <input type="text" id="m_cargo" placeholder="Ej: Director General & Coordinador BIM / CIM">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre de Imagen (ej: james-zuniga.jpg):</label>
                        <input type="text" id="m_foto">
                    </div>
                    <div class="form-group">
                        <label>Subtítulo del Modal (opcional):</label>
                        <input type="text" id="m_subtitulo" placeholder="Ej: Fundador & Principal Manager">
                    </div>
                </div>

                <div class="form-group">
                    <label>Etiquetas en Tarjeta (separadas por coma):</label>
                    <input type="text" id="m_etiquetas" placeholder="Ej: Arq. UDENAR, buildingSMART, BIM 5D">
                </div>

                <div class="form-group">
                    <label>Metadatos / Credenciales Modal (separados por coma):</label>
                    <input type="text" id="m_credenciales" placeholder="Ej: Matrícula Profesional CPNAA, buildingSMART Certified, Nariño Colombia">
                </div>

                <div class="form-group">
                    <label>Descripción / Perfil Profesional:</label>
                    <textarea id="m_biografia" placeholder="Arquitecto egresado de..."></textarea>
                </div>

                <div class="form-group">
                    <label>Formación y Certificaciones (una por línea):</label>
                    <textarea id="m_educacion" placeholder="• Arquitecto: Universidad de Nariño.&#10;• Certificación Internacional: ..."></textarea>
                </div>

                <div class="form-group">
                    <label>Proyectos Vinculados (Formato: ID|Nombre - uno por línea):</label>
                    <textarea id="m_proyectos" placeholder="auditorio-tumaco|Auditorio en Tumaco"></textarea>
                </div>

                <div class="form-actions">
                    <button class="btn-save" onclick="guardarMiembro()">Guardar Miembro</button>
                    <button class="btn-download" onclick="descargarJSON()">Descargar personal.json</button>
                    <button class="btn-delete" id="btnEliminar" onclick="eliminarMiembro()" style="display: none;">Eliminar</button>
                </div>
            </div>

        </div>
    </div>

<script>
    let personal = [];
    let indiceActual = -1;

    // Cargar datos por defecto al iniciar para no empezar en blanco
    window.onload = () => {
        personal = [
            {
                id: "james-zuniga",
                nombre: "Arq. James Ramiro Zúñiga Caipe",
                cargo: "Director General & Coordinador BIM / CIM",
                role_modal: "Fundador & Principal Manager",
                biografia: "Arquitecto egresado de la Universidad de Nariño, al frente del ecosistema técnico de InnovArqZ. Amplia trayectoria en la coordinación de modelos multidisciplinares (ARQ/EST/MEP), federación digital, detección de interferencias y control financiero presupuestal (BIM 5D) bajo la norma internacional ISO 19650 y estándares OpenBIM.",
                foto: "james-zuniga.jpg",
                etiquetas: ["Arq. UDENAR", "buildingSMART", "BIM 5D"],
                credenciales: ["Matrícula Profesional CPNAA", "buildingSMART Certified", "Nariño, Colombia"],
                educacion: "• Arquitecto: Universidad de Nariño.\n• Certificación Internacional: buildingSMART Professional Certification — Entry Level.\n• Máster BIM Manager Internacional (+IA y VR): Espacio BIM / ATC Autodesk (En Curso).\n• Diplomado BIM Civil (Infraestructuras): Universidad de Nariño.\n• Diplomado Ordenamiento Territorial (PBOT/EOT): ESAP.",
                proyectosAsociados: ["auditorio-tumaco"]
            }
        ];
        renderizarLista();
        if(personal.length > 0) seleccionarMiembro(0);
    };

    function renderizarLista() {
        const lista = document.getElementById('listaMiembros');
        lista.innerHTML = '';
        
        personal.forEach((miembro, index) => {
            const div = document.createElement('div');
            div.className = `member-item ${index === indiceActual ? 'active' : ''}`;
            div.innerText = miembro.nombre || 'Sin Nombre';
            div.onclick = () => seleccionarMiembro(index);
            lista.appendChild(div);
        });
    }

    function nuevoMiembro() {
        indiceActual = -1;
        document.getElementById('m_id').value = '';
        document.getElementById('m_nombre').value = '';
        document.getElementById('m_cargo').value = '';
        document.getElementById('m_foto').value = '';
        document.getElementById('m_subtitulo').value = '';
        document.getElementById('m_etiquetas').value = '';
        document.getElementById('m_credenciales').value = '';
        document.getElementById('m_biografia').value = '';
        document.getElementById('m_educacion').value = '';
        document.getElementById('m_proyectos').value = '';
        
        document.getElementById('btnEliminar').style.display = 'none';
        renderizarLista();
        document.getElementById('m_id').focus();
    }

    function seleccionarMiembro(index) {
        indiceActual = index;
        const m = personal[index];
        
        document.getElementById('m_id').value = m.id || '';
        document.getElementById('m_nombre').value = m.nombre || '';
        document.getElementById('m_cargo').value = m.cargo || '';
        document.getElementById('m_foto').value = m.foto || '';
        document.getElementById('m_subtitulo').value = m.role_modal || '';
        
        // Unir arrays en strings para los inputs
        document.getElementById('m_etiquetas').value = (m.etiquetas || []).join(', ');
        document.getElementById('m_credenciales').value = (m.credenciales || []).join(', ');
        document.getElementById('m_biografia').value = m.biografia || '';
        document.getElementById('m_educacion').value = m.educacion || '';
        
        // Mapear proyectos para mostrarlos en el textarea (recuperando solo IDs o ID|Nombre si tuvieras un diccionario, aquí guardaremos solo el ID en el JSON final para el frontend)
        document.getElementById('m_proyectos').value = (m.proyectosAsociados || []).join('\n');
        
        document.getElementById('btnEliminar').style.display = 'block';
        renderizarLista();
    }

    function guardarMiembro() {
        const id = document.getElementById('m_id').value.trim();
        if (!id) {
            alert('El ID Único es obligatorio.');
            return;
        }

        // Convertir strings separados por coma/salto de línea a Arrays
        const etiquetasRaw = document.getElementById('m_etiquetas').value.split(',').map(s => s.trim()).filter(s => s);
        const credencialesRaw = document.getElementById('m_credenciales').value.split(',').map(s => s.trim()).filter(s => s);
        
        // Para proyectos, el frontend solo necesita el array de IDs
        const proyectosRaw = document.getElementById('m_proyectos').value.split('\n')
            .map(s => s.trim())
            .filter(s => s)
            .map(s => s.split('|')[0].trim()); // Si el usuario escribe "id|Nombre", nos quedamos solo con el "id"

        const nuevoObjeto = {
            id: id,
            nombre: document.getElementById('m_nombre').value.trim(),
            cargo: document.getElementById('m_cargo').value.trim(),
            role_modal: document.getElementById('m_subtitulo').value.trim(),
            biografia: document.getElementById('m_biografia').value.trim(),
            foto: document.getElementById('m_foto').value.trim(),
            etiquetas: etiquetasRaw,
            credenciales: credencialesRaw,
            educacion: document.getElementById('m_educacion').value.trim(),
            proyectosAsociados: proyectosRaw
        };

        if (indiceActual === -1) {
            personal.push(nuevoObjeto);
            indiceActual = personal.length - 1;
        } else {
            personal[indiceActual] = nuevoObjeto;
        }

        renderizarLista();
        alert('Miembro guardado en memoria. Recuerda descargar el JSON.');
    }

    function eliminarMiembro() {
        if (indiceActual > -1) {
            if(confirm('¿Estás seguro de eliminar este perfil?')) {
                personal.splice(indiceActual, 1);
                nuevoMiembro();
            }
        }
    }

    function descargarJSON() {
        if (personal.length === 0) {
            alert('No hay datos para descargar.');
            return;
        }
        
        const dataStr = JSON.stringify(personal, null, 4);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = "personal.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function cargarJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                if (Array.isArray(parsed)) {
                    personal = parsed;
                    renderizarLista();
                    if(personal.length > 0) seleccionarMiembro(0);
                } else {
                    alert('El archivo JSON no tiene el formato correcto (debe ser un array).');
                }
            } catch (err) {
                alert('Error al leer el JSON: ' + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = ''; // Resetear input
    }
</script>
</body>
</html>
