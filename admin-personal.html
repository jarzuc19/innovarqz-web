<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Personal Autónomo | InnovArqZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent-copper: #d97706;
            --accent-copper-hover: #b45309;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 2rem 5%; line-height: 1.5; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap; gap: 1rem;
        }

        .title-area h1 { font-size: 1.8rem; font-weight: 800; }
        .title-area h1 span { color: var(--accent-copper); }
        .title-area p { color: var(--text-muted); font-size: 0.9rem; }

        .top-actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }

        .btn {
            background-color: var(--bg-card); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 0.6rem 1.2rem;
            border-radius: 8px; font-weight: 600; font-size: 0.88rem;
            cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;
            transition: all 0.3s ease; text-decoration: none;
        }

        .btn:hover { border-color: var(--accent-copper); color: var(--accent-copper); }
        .btn-primary { background-color: var(--accent-copper); color: #fff; border: none; }
        .btn-primary:hover { background-color: var(--accent-copper-hover); color: #fff; }
        .btn-success { background-color: var(--success-color); color: #fff; border: none; }
        .btn-danger { background-color: var(--danger-color); color: #fff; border: none; }

        .admin-layout { display: grid; grid-template-columns: 320px 1fr; gap: 2rem; }

        .sidebar-list {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem;
            max-height: 85vh; overflow-y: auto;
        }

        .sidebar-title { font-size: 1rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .member-item {
            padding: 0.85rem 1rem; border-radius: 8px; background-color: var(--bg-dark);
            border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s ease;
            display: flex; justify-content: space-between; align-items: center;
        }

        .member-item:hover, .member-item.active {
            border-color: var(--accent-copper); background-color: rgba(217, 119, 6, 0.1);
        }

        .member-info h4 { font-size: 0.92rem; font-weight: 700; color: var(--text-main); }
        .member-info p { font-size: 0.75rem; color: var(--accent-copper); }

        .form-card {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;
        }

        .form-section-title {
            font-size: 1.1rem; font-weight: 700; color: var(--accent-copper);
            border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;
            display: flex; align-items: center; gap: 0.5rem;
        }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
        .full-width { grid-column: span 2; }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.82rem; font-weight: 600; color: var(--text-main); }
        
        .form-group input, .form-group textarea, .form-group select {
            background-color: var(--bg-dark); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 0.7rem 1rem; color: var(--text-main);
            font-size: 0.9rem; outline: none; transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-copper); }
        .form-group textarea { resize: vertical; min-height: 90px; }

        .top-profile-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.5rem;
            align-items: stretch;
        }

        .photo-upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-dark);
            width: 100%;
            aspect-ratio: 3 / 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .photo-upload-box:hover { border-color: var(--accent-copper); }
        
        .photo-upload-box input[type="file"] {
            position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5;
        }

        .photo-preview-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: center 20%; z-index: 2; display: none;
        }

        .photo-placeholder-content {
            position: relative; z-index: 1; text-align: center; color: var(--text-muted); padding: 1rem;
        }

        .photo-placeholder-content i { color: var(--accent-copper); margin-bottom: 0.5rem; }
        .photo-placeholder-content span { font-size: 0.78rem; font-weight: 600; }

        .right-fields-stack {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
        }

        .metadata-row { display: grid; grid-template-columns: 200px 1fr 40px; gap: 0.75rem; align-items: center; margin-bottom: 0.5rem; }
        .project-checkbox-list { display: flex; flex-direction: column; gap: 0.5rem; background: var(--bg-dark); border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; max-height: 160px; overflow-y: auto; }
        .project-checkbox-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.88rem; color: var(--text-main); cursor: pointer; }
        .project-checkbox-item input { accent-color: var(--accent-copper); width: 16px; height: 16px; cursor: pointer; }

        .github-config-box {
            background-color: var(--bg-dark); border: 1px solid var(--border-color);
            padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;
        }

        @media (max-width: 900px) {
            .admin-layout { grid-template-columns: 1fr; }
            .top-profile-layout { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .metadata-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="title-area">
            <h1>Innov<span>ArqZ</span> — Panel Autónomo de Personal</h1>
            <p>Gestión del equipo técnico con publicación directa a GitHub.</p>
        </div>

        <div class="top-actions">
            <button type="button" class="btn btn-success" onclick="publicarEnGitHub()">
                <i data-lucide="cloud-upload"></i> Publicar Cambios en GitHub
            </button>
        </div>
    </header>

    <div class="admin-layout">
        <div class="sidebar-list">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <span class="sidebar-title">Integrantes</span>
                <button type="button" class="btn btn-primary" style="padding: 0.4rem 0.7rem; font-size: 0.8rem;" onclick="crearNuevoMiembro()">
                    <i data-lucide="plus"></i> Nuevo
                </button>
            </div>
            <div id="membersContainer"></div>
        </div>

        <div class="form-card">
            <div class="github-config-box">
                <div class="form-group" style="flex: 1; min-width: 200px;">
                    <label for="ghRepo">Repositorio (usuario/repositorio)</label>
                    <input type="text" id="ghRepo" placeholder="ej: tuusuario/innovarqz">
                </div>
                <div class="form-group" style="flex: 1; min-width: 200px;">
                    <label for="ghToken">Token de GitHub (Personal Access Token)</label>
                    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <button type="button" class="btn" style="height: 42px;" onclick="guardarConfigGitHub()">Guardar Credenciales</button>
            </div>

            <form id="memberForm">
                <div class="form-section-title"><i data-lucide="user"></i> Información de la Ficha Principal</div>
                
                <div class="top-profile-layout" style="margin-top: 1rem;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Fotografía (Proporción 3:4)</label>
                        <div class="photo-upload-box" id="photoDropZone">
                            <input type="file" id="memberPhotoFile" accept="image/*" onchange="procesarFotoLocal(event)">
                            <img id="photoPreview" class="photo-preview-img" alt="Vista previa de foto">
                            <div class="photo-placeholder-content" id="photoPlaceholder">
                                <i data-lucide="image-plus" style="width: 28px; height: 28px;"></i>
                                <span>Subir foto (3:4)</span>
                            </div>
                        </div>
                        <input type="hidden" id="memberImg">
                    </div>

                    <div class="right-fields-stack">
                        <div class="form-group">
                            <label for="memberId">ID Único (sin espacios)</label>
                            <input type="text" id="memberId" required placeholder="ej: james-zuniga">
                        </div>

                        <div class="form-group">
                            <label for="memberName">Nombre Profesional Completo</label>
                            <input type="text" id="memberName" required placeholder="ej: Arq. James Ramiro Zúñiga Caipe">
                        </div>

                        <div class="form-group">
                            <label for="memberRole">Cargo Principal (Ficha)</label>
                            <input type="text" id="memberRole" required placeholder="ej: Director General & Coordinador BIM / CIM">
                        </div>
                    </div>
                </div>

                <div class="form-grid" style="margin-top: 1.25rem;">
                    <div class="form-group full-width">
                        <label for="memberShortDesc">Descripción Corta (Ficha del carrusel)</label>
                        <textarea id="memberShortDesc" required placeholder="Líder ejecutivo en metodologías OpenBIM..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="memberTags">Etiquetas / Badges (separadas por coma)</label>
                        <input type="text" id="memberTags" placeholder="ej: Arq. UDENAR, buildingSMART, BIM 5D">
                    </div>

                    <div class="form-group">
                        <label for="memberBtnText">Texto del Botón Acción</label>
                        <input type="text" id="memberBtnText" value="Conoce a Nuestro Aliado">
                    </div>
                </div>

                <div id="modalSectionArea" style="margin-top: 1.5rem;">
                    <div class="form-section-title"><i data-lucide="file-text"></i> Contenido del Modal Detallado</div>

                    <div class="form-grid" style="margin-top: 1rem;">
                        <div class="form-group full-width">
                            <label for="modalSubtitle">Subtítulo del Modal</label>
                            <input type="text" id="modalSubtitle" placeholder="ej: Fundador & Principal Manager">
                        </div>

                        <div class="form-group full-width">
                            <label>Metadatos del Encabezado (Selector de Iconos + Texto)</label>
                            <div id="metadataContainer"></div>
                            <button type="button" class="btn" style="align-self: flex-start; margin-top: 0.4rem; font-size: 0.78rem;" onclick="agregarFilaMetadato()">
                                <i data-lucide="plus"></i> Agregar Metadato
                            </button>
                        </div>

                        <div class="form-group full-width">
                            <label for="modalExecDesc">Perfil Ejecutivo & Dirección Técnica (Párrafo largo)</label>
                            <textarea id="modalExecDesc" style="min-height: 110px;"></textarea>
                        </div>

                        <div class="form-group full-width">
                            <label for="modalEducation">Formación Académica & Certificaciones (Una por línea)</label>
                            <textarea id="modalEducation" style="min-height: 120px;" placeholder="Arquitecto: Universidad de Nariño.&#10;Certificación Internacional: buildingSMART..."></textarea>
                        </div>

                        <div class="form-group full-width">
                            <label>Proyectos Asociados (Selecciona los proyectos del portafolio en los que participa)</label>
                            <div class="project-checkbox-list" id="projectsCheckboxContainer">
                                <span style="color: var(--text-muted); font-size: 0.85rem;">Cargando proyectos desde proyectos.json...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                    <button type="button" class="btn btn-danger" onclick="eliminarMiembroActual()"><i data-lucide="trash-2"></i> Eliminar Integrante</button>
                    <button type="button" class="btn btn-primary" onclick="guardarMiembroActual()"><i data-lucide="save"></i> Guardar Cambios Temporal</button>
                </div>
            </form>
        </div>
    </div>

<script>
    let personalData = [];
    let proyectosDisponibles = [];
    let currentSelectedIndex = 0;
    let fileSha = ""; // Necesario para la API de GitHub

    const listaIconosDisponibles = [
        { valor: "award", etiqueta: "🏆 Medalla / Matrícula Profesional (award)" },
        { valor: "shield-check", etiqueta: "🛡️ Escudo / Certificación (shield-check)" },
        { valor: "map-pin", etiqueta: "📍 Ubicación / Ciudad (map-pin)" },
        { valor: "graduation-cap", etiqueta: "🎓 Grado / Universidad (graduation-cap)" },
        { valor: "briefcase", etiqueta: "💼 Experiencia / Trabajo (briefcase)" },
        { valor: "cpu", etiqueta: "💻 Tecnología / Software (cpu)" },
        { valor: "book-open", etiqueta: "📖 Estudios / Cursos (book-open)" },
        { valor: "check-circle", etiqueta: "✅ Verificado / Aprobado (check-circle)" },
        { valor: "user", etiqueta: "👤 Persona / Perfil (user)" }
    ];

    document.addEventListener('DOMContentLoaded', async () => {
        if (window.lucide) lucide.createIcons();
        cargarCredencialesGuardadas();
        await cargarDatosAutomaticos();
    });

    function cargarCredencialesGuardadas() {
        const repo = localStorage.getItem('gh_repo') || '';
        const token = localStorage.getItem('gh_token') || '';
        document.getElementById('ghRepo').value = repo;
        document.getElementById('ghToken').value = token;
    }

    function guardarConfigGitHub() {
        const repo = document.getElementById('ghRepo').value.trim();
        const token = document.getElementById('ghToken').value.trim();
        localStorage.setItem('gh_repo', repo);
        localStorage.setItem('gh_token', token);
        alert('¡Credenciales de GitHub guardadas localmente en tu navegador!');
    }

    async function cargarDatosAutomaticos() {
        try {
            // Cargar proyectos.json
            const resProj = await fetch('proyectos.json?v=' + Date.now());
            if (resProj.ok) proyectosDisponibles = await resProj.json();

            // Cargar personal.json
            const resPers = await fetch('personal.json?v=' + Date.now());
            if (resPers.ok) {
                personalData = await resPers.json();
            } else {
                personalData = [{
                    "id": "james-zuniga",
                    "nombre": "Arq. James Ramiro Zúñiga Caipe",
                    "cargoFicha": "Director General & Coordinador BIM / CIM",
                    "descripcionCorta": "Líder ejecutivo en metodologías OpenBIM (ISO 19650)...",
                    "imagen": "james-zuniga.jpg",
                    "tieneImagen": true,
                    "etiquetas": ["Arq. UDENAR", "buildingSMART"],
                    "textoBoton": "Conoce a Nuestro Aliado",
                    "proyectosAsociados": [],
                    "modalDetalle": {
                        "subtitulo": "Fundador & Principal Manager",
                        "metadatos": [{"icono": "award", "texto": "Matrícula Profesional CPNAA"}],
                        "seccionPerfil": { "titulo": "Perfil Ejecutivo", "descripcion": "..." },
                        "seccionFormacion": { "titulo": "Formación", "items": ["..."] }
                    }
                }];
            }

            renderizarListaMiembros();
            cargarMiembroEnFormulario(0);
        } catch (err) {
            console.error('Error al cargar datos automáticos:', err);
        }
    }

    function renderizarListaMiembros() {
        const container = document.getElementById('membersContainer');
        container.innerHTML = '';

        personalData.forEach((m, idx) => {
            const item = document.createElement('div');
            item.className = `member-item ${idx === currentSelectedIndex ? 'active' : ''}`;
            item.onclick = () => { guardarMiembroSilencioso(); currentSelectedIndex = idx; renderizarListaMiembros(); cargarMiembroEnFormulario(idx); };
            item.innerHTML = `
                <div class="member-info">
                    <h4>${m.nombre || 'Sin nombre'}</h4>
                    <p>${m.cargoFicha || 'Sin cargo'}</p>
                </div>
                <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--text-muted);"></i>
            `;
            container.appendChild(item);
        });

        if (window.lucide) lucide.createIcons();
    }

    function cargarMiembroEnFormulario(idx) {
        const m = personalData[idx];
        if (!m) return;

        document.getElementById('memberId').value = m.id || '';
        document.getElementById('memberName').value = m.nombre || '';
        document.getElementById('memberRole').value = m.cargoFicha || '';
        document.getElementById('memberImg').value = m.imagen || '';
        document.getElementById('memberShortDesc').value = m.descripcionCorta || '';
        document.getElementById('memberTags').value = (m.etiquetas || []).join(', ');
        document.getElementById('memberBtnText').value = m.textoBoton || 'Conoce a Nuestro Aliado';

        const imgPreview = document.getElementById('photoPreview');
        const placeholder = document.getElementById('photoPlaceholder');
        if (m.imagen) {
            imgPreview.src = m.imagen;
            imgPreview.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            imgPreview.src = '';
            imgPreview.style.display = 'none';
            placeholder.style.display = 'block';
        }

        if (m.modalDetalle) {
            document.getElementById('modalSubtitle').value = m.modalDetalle.subtitulo || '';
            document.getElementById('modalExecDesc').value = m.modalDetalle.seccionPerfil ? m.modalDetalle.seccionPerfil.descripcion : '';
            document.getElementById('modalEducation').value = m.modalDetalle.seccionFormacion ? (m.modalDetalle.seccionFormacion.items || []).join('\n') : '';
            renderMetadatos(m.modalDetalle.metadatos || []);
        }

        renderProyectosCheckbox(m.proyectosAsociados || []);
    }

    function renderProyectosCheckbox(asociadosIds) {
        const container = document.getElementById('projectsCheckboxContainer');
        if (!proyectosDisponibles.length) {
            container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem;">No se encontraron proyectos en proyectos.json</span>`;
            return;
        }

        let html = '';
        proyectosDisponibles.forEach(p => {
            const isChecked = asociadosIds.includes(p.id) ? 'checked' : '';
            html += `
                <label class="project-checkbox-item">
                    <input type="checkbox" value="${p.id}" ${isChecked} class="proj-check-input">
                    <span>${p.title} (${p.year || '2026'})</span>
                </label>
            `;
        });
        container.innerHTML = html;
    }

    function procesarFotoLocal(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const dataUrl = e.target.result;
            document.getElementById('memberImg').value = file.name;
            
            const imgPreview = document.getElementById('photoPreview');
            const placeholder = document.getElementById('photoPlaceholder');
            imgPreview.src = dataUrl;
            imgPreview.style.display = 'block';
            placeholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    function renderMetadatos(metas) {
        const container = document.getElementById('metadataContainer');
        container.innerHTML = '';

        metas.forEach((m, i) => {
            const row = document.createElement('div');
            row.className = 'metadata-row';

            let optionsHtml = '';
            listaIconosDisponibles.forEach(ic => {
                const selected = ic.valor === m.icono ? 'selected' : '';
                optionsHtml += `<option value="${ic.valor}" ${selected}>${ic.etiqueta}</option>`;
            });

            row.innerHTML = `
                <select class="meta-icon-select" style="background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem; border-radius: 6px; font-size: 0.85rem;">
                    ${optionsHtml}
                </select>
                <input type="text" placeholder="Texto descriptivo" value="${m.texto || ''}" class="meta-text-input">
                <button type="button" class="btn btn-danger" style="padding: 0.4rem;" onclick="eliminarMetadato(${i})"><i data-lucide="x" style="width: 14px; height: 14px;"></i></button>
            `;
            container.appendChild(row);
        });

        if (window.lucide) lucide.createIcons();
    }

    function agregarFilaMetadato() {
        const container = document.getElementById('metadataContainer');
        const row = document.createElement('div');
        row.className = 'metadata-row';

        let optionsHtml = '';
        listaIconosDisponibles.forEach(ic => {
            optionsHtml += `<option value="${ic.valor}">${ic.etiqueta}</option>`;
        });

        row.innerHTML = `
            <select class="meta-icon-select" style="background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem; border-radius: 6px; font-size: 0.85rem;">
                ${optionsHtml}
            </select>
            <input type="text" placeholder="Texto descriptivo" value="" class="meta-text-input">
            <button type="button" class="btn btn-danger" style="padding: 0.4rem;" onclick="this.parentElement.remove()"><i data-lucide="x" style="width: 14px; height: 14px;"></i></button>
        `;
        container.appendChild(row);
        if (window.lucide) lucide.createIcons();
    }

    function eliminarMetadato(index) {
        const m = personalData[currentSelectedIndex];
        if (m && m.modalDetalle && m.modalDetalle.metadatos) {
            m.modalDetalle.metadatos.splice(index, 1);
            renderMetadatos(m.modalDetalle.metadatos);
        }
    }

    function guardarMiembroSilencioso() {
        const m = personalData[currentSelectedIndex];
        if (!m) return;

        m.id = document.getElementById('memberId').value.trim();
        m.nombre = document.getElementById('memberName').value.trim();
        m.cargoFicha = document.getElementById('memberRole').value.trim();
        m.imagen = document.getElementById('memberImg').value.trim();
        m.tieneImagen = m.imagen !== '';
        m.descripcionCorta = document.getElementById('memberShortDesc').value.trim();
        m.etiquetas = document.getElementById('memberTags').value.split(',').map(t => t.trim()).filter(Boolean);
        m.textoBoton = document.getElementById('memberBtnText').value.trim();

        const metaRows = document.querySelectorAll('.metadata-row');
        const metas = [];
        metaRows.forEach(r => {
            const icon = r.querySelector('.meta
