<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Personal Autónomo | InnovArqZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-section-alt: #0b1120;
            --accent-copper: #d97706;
            --accent-copper-hover: #b45309;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 2rem 5%; line-height: 1.5; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap; gap: 1rem;
        }

        .title-area h1 { font-size: 1.8rem; font-weight: 800; }
        .title-area h1 span { color: var(--accent-copper); }
        .title-area p { color: var(--text-muted); font-size: 0.9rem; }

        .github-bar {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px var(--shadow-color);
            flex-wrap: wrap;
        }

        .github-bar input {
            background-color: var(--bg-section-alt);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            flex-grow: 1;
            min-width: 220px;
        }

        .github-bar input:focus { border-color: var(--accent-copper); }

        .btn {
            background-color: var(--bg-card); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 0.75rem 1.25rem;
            border-radius: 8px; font-weight: 600; font-size: 0.88rem;
            cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;
            transition: all 0.3s ease; text-decoration: none; white-space: nowrap;
        }

        .btn:hover { border-color: var(--accent-copper); color: var(--accent-copper); }
        .btn-primary { background-color: var(--accent-copper); color: #fff; border: none; }
        .btn-primary:hover { background-color: var(--accent-copper-hover); color: #fff; }
        .btn-success { background-color: var(--success-color); color: #fff; border: none; }
        .btn-success:hover { background-color: #059669; }
        .btn-danger { background-color: rgba(239, 68, 68, 0.15); color: var(--danger-color); border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-danger:hover { background-color: var(--danger-color); color: #fff; }

        .admin-layout { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; align-items: start; }

        .sidebar-list {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem;
            max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 25px var(--shadow-color);
        }

        .sidebar-title { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .member-item {
            padding: 0.85rem 1rem; border-radius: 8px; background-color: var(--bg-dark);
            border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s ease;
            display: flex; justify-content: space-between; align-items: center;
        }

        .member-item:hover, .member-item.active {
            border-color: var(--accent-copper); background-color: rgba(217, 119, 6, 0.1);
        }

        .member-info h4 { font-size: 0.92rem; font-weight: 700; color: var(--text-main); }
        .member-info p { font-size: 0.75rem; color: var(--accent-copper); }

        .form-card {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;
            box-shadow: 0 15px 35px var(--shadow-color); opacity: 0.4; pointer-events: none; transition: opacity 0.3s;
        }

        .form-card.active-panel { opacity: 1; pointer-events: auto; }

        .form-section-title {
            font-size: 1.1rem; font-weight: 700; color: var(--accent-copper);
            border-bottom: 1px solid var(--border-color); padding-bottom: 0.6rem;
            display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;
        }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
        .full-width { grid-column: span 2; }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.82rem; font-weight: 600; color: var(--text-main); }
        
        .form-group input, .form-group textarea, .form-group select {
            background-color: var(--bg-section-alt); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 0.75rem 1rem; color: var(--text-main);
            font-size: 0.9rem; outline: none; transition: border-color 0.3s; width: 100%;
        }

        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-copper); }
        .form-group textarea { resize: vertical; min-height: 100px; }

        .top-profile-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 1.5rem;
            align-items: stretch;
        }

        .photo-upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-section-alt);
            width: 100%;
            aspect-ratio: 3 / 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .photo-upload-box:hover { border-color: var(--accent-copper); }
        
        .photo-upload-box input[type="file"] {
            position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5;
        }

        .photo-preview-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: center; z-index: 2; display: none;
        }

        .photo-placeholder-content {
            position: relative; z-index: 1; text-align: center; color: var(--text-muted); padding: 1rem;
        }

        .photo-placeholder-content i { color: var(--accent-copper); margin-bottom: 0.5rem; }
        .photo-placeholder-content span { font-size: 0.78rem; font-weight: 600; display: block; }

        .right-fields-stack {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
        }

        .metadata-row { display: grid; grid-template-columns: 220px 1fr 40px; gap: 0.75rem; align-items: center; margin-bottom: 0.5rem; }
        
        .project-checkbox-list {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem;
            background: var(--bg-section-alt); border: 1px solid var(--border-color);
            padding: 1rem; border-radius: 8px; max-height: 180px; overflow-y: auto;
        }
        .project-checkbox-item { display: flex; align-items: center; gap: 0.6rem; font-size: 0.88rem; color: var(--text-main); cursor: pointer; background: var(--bg-card); padding: 0.5rem 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; }
        .project-checkbox-item:hover { border-color: var(--accent-copper); }
        .project-checkbox-item input { accent-color: var(--accent-copper); width: 16px; height: 16px; cursor: pointer; }

        .status-bar {
            margin-top: 1rem; padding: 0.85rem 1.25rem; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
            display: none; align-items: center; gap: 0.5rem;
        }
        .status-bar.success { background: rgba(16, 185, 129, 0.15); color: var(--success-color); border: 1px solid var(--success-color); display: flex; }
        .status-bar.error { background: rgba(239, 68, 68, 0.15); color: var(--danger-color); border: 1px solid var(--danger-color); display: flex; }
        .status-bar.syncing { background: rgba(217, 119, 6, 0.15); color: var(--accent-copper); border: 1px solid var(--accent-copper); display: flex; }

        @media (max-width: 900px) {
            .admin-layout { grid-template-columns: 1fr; }
            .top-profile-layout { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .metadata-row { grid-template-columns: 1fr; }
            .project-checkbox-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="title-area">
            <h1>Innov<span>ArqZ</span> — Panel de Personal</h1>
            <p>Gestión del equipo técnico con sincronización directa en GitHub.</p>
        </div>
    </header>

    <div class="github-bar">
        <input type="password" id="ghToken" placeholder="GitHub Token (ghp_...)" autocomplete="off">
        <input type="text" id="ghRepo" placeholder="Repositorio (ej. jarzuc19/innovarqz-web)">
        <button type="button" class="btn btn-primary" onclick="conectarYCargarGitHub()">
            <i data-lucide="cloud-download"></i> Cargar Personal y Proyectos
        </button>
    </div>

    <div class="admin-layout">
        <div class="sidebar-list">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <span class="sidebar-title">Integrantes</span>
                <button type="button" class="btn btn-primary" style="padding: 0.4rem 0.7rem; font-size: 0.8rem;" onclick="crearNuevoMiembro()">
                    <i data-lucide="plus"></i> Nuevo
                </button>
            </div>
            <div id="membersContainer" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 1rem;">Conecta con GitHub</div>
            </div>
        </div>

        <div class="form-card" id="formCard">
            <div class="form-section-title"><i data-lucide="user"></i> 1. Tarjeta en la Sección "Nosotros"</div>
            
            <div class="top-profile-layout">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Fotografía (3:4)</label>
                    <div class="photo-upload-box" id="photoDropZone">
                        <input type="file" id="memberPhotoFile" accept="image/*" onchange="procesarFotoLocal(event)">
                        <img id="photoPreview" class="photo-preview-img" alt="Vista previa">
                        <div class="photo-placeholder-content" id="photoPlaceholder">
                            <i data-lucide="image-plus" style="width: 28px; height: 28px;"></i>
                            <span>Haz clic o arrastra la foto</span>
                        </div>
                    </div>
                </div>

                <div class="right-fields-stack">
                    <div class="form-group">
                        <label for="memberId">ID Único (Sin espacios, ej: james-zuniga)</label>
                        <input type="text" id="memberId" required placeholder="james-zuniga" oninput="sincronizarEnVivo()">
                    </div>

                    <div class="form-group">
                        <label for="memberName">Nombre Profesional Completo</label>
                        <input type="text" id="memberName" required placeholder="Arq. James Ramiro Zúñiga Caipe" oninput="sincronizarEnVivo()">
                    </div>

                    <div class="form-group">
                        <label for="memberRole">Cargo Principal (En Tarjeta)</label>
                        <input type="text" id="memberRole" required placeholder="Director General & Coordinador BIM" oninput="sincronizarEnVivo()">
                    </div>
                </div>
            </div>

            <div class="form-grid" style="margin-top: 1rem;">
                <div class="form-group full-width">
                    <label for="memberTags">Etiquetas en Tarjeta (Separadas por coma)</label>
                    <input type="text" id="memberTags" placeholder="Arq. UDENAR, buildingSMART, BIM 5D" oninput="sincronizarEnVivo()">
                </div>
            </div>

            <div class="form-section-title" style="margin-top: 1.5rem;"><i data-lucide="file-text"></i> 2. Detalle del Modal Dinámico</div>

            <div class="form-grid" style="margin-top: 1rem;">
                <div class="form-group full-width">
                    <label for="modalSubtitle">Subtítulo del Modal</label>
                    <input type="text" id="modalSubtitle" placeholder="Fundador & Principal Manager" oninput="sincronizarEnVivo()">
                </div>

                <div class="form-group full-width">
                    <label>Credenciales con Icono (Aparecen arriba en el modal)</label>
                    <div id="metadataContainer" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
                    <button type="button" class="btn" style="align-self: flex-start; margin-top: 0.4rem; font-size: 0.78rem;" onclick="agregarFilaMetadato()">
                        <i data-lucide="plus"></i> Agregar Credencial
                    </button>
                </div>

                <div class="form-group full-width">
                    <label for="modalExecDesc">Perfil Ejecutivo & Dirección Técnica</label>
                    <textarea id="modalExecDesc" placeholder="Arquitecto egresado de..." oninput="sincronizarEnVivo()"></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="modalEducation">Formación Académica & Certificaciones (Una por línea)</label>
                    <textarea id="modalEducation" placeholder="• Arquitecto: Universidad de Nariño.&#10;• Certificación..." oninput="sincronizarEnVivo()"></textarea>
                </div>
            </div>

            <div class="form-section-title" style="margin-top: 1.5rem;"><i data-lucide="box"></i> 3. Proyectos Asociados</div>

            <div class="form-group full-width">
                <label>Selecciona los proyectos en los que participa este profesional:</label>
                <div class="project-checkbox-list" id="projectsCheckboxContainer">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Cargando proyectos...</span>
                </div>
            </div>

            <div class="status-bar" id="statusBar"></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                <button type="button" class="btn btn-danger" id="btnEliminarMiembro" onclick="eliminarMiembroActual()" style="display: none;"><i data-lucide="trash-2"></i> Eliminar Integrante</button>
                <button type="button" class="btn btn-success" style="margin-left: auto;" onclick="guardarYSubirGitHub()"><i data-lucide="cloud-upload"></i> Guardar y Subir a GitHub</button>
            </div>
        </div>
    </div>

<script>
    let personalGlobal = [];
    let proyectosGlobales = [];
    let personalFileSha = null;
    let currentIndex = 0;

    const listaIconos = [
        { valor: "award", etiqueta: "🏆 Medalla / Matrícula" },
        { valor: "shield-check", etiqueta: "🛡️ Escudo / Certificación" },
        { valor: "map-pin", etiqueta: "📍 Ubicación / Ciudad" },
        { valor: "graduation-cap", etiqueta: "🎓 Grado / Universidad" },
        { valor: "briefcase", etiqueta: "💼 Experiencia" },
        { valor: "cpu", etiqueta: "💻 Tecnología / BIM" },
        { valor: "user", etiqueta: "👤 Perfil" }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) lucide.createIcons();
        document.getElementById('ghToken').value = localStorage.getItem('gh_token_pers') || '';
        document.getElementById('ghRepo').value = localStorage.getItem('gh_repo_pers') || 'jarzuc19/innovarqz-web';
    });

    function guardarCredenciales() {
        localStorage.setItem('gh_token_pers', document.getElementById('ghToken').value.trim());
        localStorage.setItem('gh_repo_pers', document.getElementById('ghRepo').value.trim());
    }

    function mostrarEstado(mensaje, tipo) {
        const bar = document.getElementById('statusBar');
        bar.className = `status-bar ${tipo}`;
        let icon = 'info';
        if(tipo === 'success') icon = 'check-circle';
        if(tipo === 'error') icon = 'alert-triangle';
        if(tipo === 'syncing') icon = 'refresh-cw';
        bar.innerHTML = `<i data-lucide="${icon}"></i> <span>${mensaje}</span>`;
        if (window.lucide) lucide.createIcons();
    }

    function decodeBase64UTF8(base64) {
        const binString = atob(base64);
        const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
        return new TextDecoder().decode(bytes);
    }

    async function conectarYCargarGitHub() {
        guardarCredenciales();
        const token = document.getElementById('ghToken').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();

        if (!token || !repo) {
            alert('Ingresa tu Token y Repositorio.');
            return;
        }

        mostrarEstado('Conectando con GitHub...', 'syncing');

        try {
            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            };

            // 1. Cargar proyectos.json de forma segura
            try {
                const resProj = await fetch(`https://api.github.com/repos/${repo}/contents/proyectos.json`, { headers });
                if (resProj.ok) {
                    const dataProj = await resProj.json();
                    proyectosGlobales = JSON.parse(decodeBase64UTF8(dataProj.content));
                } else {
                    proyectosGlobales = [];
                }
            } catch (e) {
                proyectosGlobales = [];
            }

            // 2. Cargar personal.json (Si no existe, se inicializa vacío sin generar error)
            try {
                const resPers = await fetch(`https://api.github.com/repos/${repo}/contents/personal.json`, { headers });
                if (resPers.ok) {
                    const dataPers = await resPers.json();
                    personalFileSha = dataPers.sha;
                    personalGlobal = JSON.parse(decodeBase64UTF8(dataPers.content));
                } else {
                    personalGlobal = [];
                    personalFileSha = null;
                }
            } catch (e) {
                personalGlobal = [];
                personalFileSha = null;
            }

            document.getElementById('formCard').classList.add('active-panel');
            renderizarListaMiembros();

            if (personalGlobal.length > 0) {
                cargarMiembroEnFormulario(0);
            } else {
                crearNuevoMiembro();
            }

            mostrarEstado('¡Conexión y carga exitosa con GitHub!', 'success');
        } catch (err) {
            console.error(err);
            mostrarEstado('Error al conectar con la API de GitHub. Verifica tu Token y Repositorio.', 'error');
        }
    }

    function renderizarListaMiembros() {
        const container = document.getElementById('membersContainer');
        container.innerHTML = '';

        personalGlobal.forEach((m, idx) => {
            const item = document.createElement('div');
            item.className = `member-item ${idx === currentIndex ? 'active' : ''}`;
            item.onclick = () => {
                sincronizarFormularioAMemoria();
                currentIndex = idx;
                renderizarListaMiembros();
                cargarMiembroEnFormulario(idx);
            };
            item.innerHTML = `
                <div class="member-info">
                    <h4>${m.nombre || 'Sin nombre'}</h4>
                    <p>${m.cargo || 'Sin cargo'}</p>
                </div>
                <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--text-muted);"></i>
            `;
            container.appendChild(item);
        });
        if (window.lucide) lucide.createIcons();
    }

    function cargarMiembroEnFormulario(idx) {
        currentIndex = idx;
        const m = personalGlobal[idx];
        if (!m) return;

        document.getElementById('memberId').value = m.id || '';
        document.getElementById('memberName').value = m.nombre || '';
        document.getElementById('memberRole').value = m.cargo || '';
        document.getElementById('memberTags').value = (m.etiquetas || []).join(', ');
        
        document.getElementById('modalSubtitle').value = m.role_modal || '';
        document.getElementById('modalExecDesc').value = m.biografia || '';
        document.getElementById('modalEducation').value = m.educacion || '';

        const imgPreview = document.getElementById('photoPreview');
        const placeholder = document.getElementById('photoPlaceholder');
        if (m.foto) {
            imgPreview.src = m.foto;
            imgPreview.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            imgPreview.src = '';
            imgPreview.style.display = 'none';
            placeholder.style.display = 'block';
        }

        let metasParaForm = [];
        if (Array.isArray(m.credenciales)) {
            m.credenciales.forEach(cred => {
                if (typeof cred === 'string') {
                    metasParaForm.push({ icono: 'award', texto: cred });
                } else if (typeof cred === 'object' && cred !== null) {
                    metasParaForm.push(cred);
                }
            });
        }
        renderMetadatos(metasParaForm);
        renderProyectosCheckbox(m.proyectosAsociados || []);

        document.getElementById('btnEliminarMiembro').style.display = personalGlobal.length > 1 ? 'inline-flex' : 'none';
        renderizarListaMiembros();
    }

    function procesarFotoLocal(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const dataUrl = e.target.result;
            const m = personalGlobal[currentIndex];
            if (m) {
                m.foto = dataUrl;
            }

            const imgPreview = document.getElementById('photoPreview');
            const placeholder = document.getElementById('photoPlaceholder');
            imgPreview.src = dataUrl;
            imgPreview.style.display = 'block';
            placeholder.style.display = 'none';

            mostrarEstado('Fotografía cargada en memoria con éxito.', 'success');
        };
        reader.readAsDataURL(file);
    }

    function renderMetadatos(metas) {
        const container = document.getElementById('metadataContainer');
        container.innerHTML = '';

        metas.forEach((meta, i) => {
            const row = document.createElement('div');
            row.className = 'metadata-row';

            let optionsHtml = '';
            listaIconos.forEach(ic => {
                const sel = ic.valor === meta.icono ? 'selected' : '';
                optionsHtml += `<option value="${ic.valor}" ${sel}>${ic.etiqueta}</option>`;
            });

            row.innerHTML = `
                <select class="meta-icon-select" onchange="sincronizarEnVivo()" style="background: var(--bg-section-alt); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem; border-radius: 6px; font-size: 0.82rem;">
                    ${optionsHtml}
                </select>
                <input type="text" class="meta-text-input" value="${meta.texto || ''}" placeholder="Texto de credencial" oninput="sincronizarEnVivo()">
                <button type="button" class="btn btn-danger" style="padding: 0.4rem; justify-content: center;" onclick="eliminarMetadato(${i})"><i data-lucide="x" style="width: 14px; height: 14px;"></i></button>
            `;
            container.appendChild(row);
        });
        if (window.lucide) lucide.createIcons();
    }

    function agregarFilaMetadato() {
        const m = personalGlobal[currentIndex];
        if (!m) return;
        if (!Array.isArray(m.credenciales)) m.credenciales = [];
        m.credenciales.push({ icono: "award", texto: "" });
        cargarMiembroEnFormulario(currentIndex);
    }

    function eliminarMetadato(i) {
        const m = personalGlobal[currentIndex];
        if (m && Array.isArray(m.credenciales)) {
            m.credenciales.splice(i, 1);
            cargarMiembroEnFormulario(currentIndex);
        }
    }

    function renderProyectosCheckbox(asociados) {
        const container = document.getElementById('projectsCheckboxContainer');
        if (!proyectosGlobales.length) {
            container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem;">No hay proyectos en proyectos.json (puedes continuar sin seleccionarlos)</span>`;
            return;
        }

        let html = '';
        proyectosGlobales.forEach(p => {
            const checked = asociados.includes(p.id) ? 'checked' : '';
            html += `
                <label class="project-checkbox-item">
                    <input type="checkbox" value="${p.id}" ${checked} class="proj-check" onchange="sincronizarEnVivo()">
                    <span>${p.title} (${p.year || '2026'})</span>
                </label>
            `;
        });
        container.innerHTML = html;
    }

    function sincronizarEnVivo() {
        sincronizarFormularioAMemoria();
    }

    function sincronizarFormularioAMemoria() {
        const m = personalGlobal[currentIndex];
        if (!m) return;

        m.id = document.getElementById('memberId').value.trim();
        m.nombre = document.getElementById('memberName').value.trim();
        m.cargo = document.getElementById('memberRole').value.trim();
        m.etiquetas = document.getElementById('memberTags').value.split(',').map(s => s.trim()).filter(Boolean);
        
        m.role_modal = document.getElementById('modalSubtitle').value.trim();
        m.biografia = document.getElementById('modalExecDesc').value.trim();
        m.educacion = document.getElementById('modalEducation').value.trim();

        const rows = document.querySelectorAll('.metadata-row');
        let credsArray = [];
        rows.forEach(r => {
            const icono = r.querySelector('.meta-icon-select').value;
            const texto = r.querySelector('.meta-text-input').value.trim();
            if (texto) credsArray.push({ icono, texto });
        });
        m.credenciales = credsArray;

        const checks = document.querySelectorAll('.proj-check:checked');
        m.proyectosAsociados = Array.from(checks).map(c => c.value);

        const titleEl = document.querySelectorAll('.member-item')[currentIndex]?.querySelector('h4');
        const roleEl = document.querySelectorAll('.member-item')[currentIndex]?.querySelector('p');
        if (titleEl) titleEl.textContent = m.nombre || 'Sin nombre';
        if (roleEl) roleEl.textContent = m.cargo || 'Sin cargo';
    }

    function crearNuevoMiembro() {
        sincronizarFormularioAMemoria();
        const nuevo = {
            id: "nuevo-miembro-" + Date.now(),
            nombre: "Nuevo Profesional",
            cargo: "Especialista Técnico",
            foto: "",
            etiquetas: ["Especialidad"],
            role_modal: "Cargo / Rol",
            credenciales: [{ icono: "award", texto: "Matrícula Profesional" }],
            biografia: "Descripción del perfil profesional...",
            educacion: "• Título: Universidad de Nariño.",
            proyectosAsociados: []
        };
        personalGlobal.push(nuevo);
        currentIndex = personalGlobal.length - 1;
        renderizarListaMiembros();
        cargarMiembroEnFormulario(currentIndex);
    }

    function eliminarMiembroActual() {
        if (personalGlobal.length <= 1) {
            alert('Debe existir al menos un integrante.');
            return;
        }
        if (confirm('¿Desea eliminar este integrante?')) {
            personalGlobal.splice(currentIndex, 1);
            currentIndex = Math.max(0, currentIndex - 1);
            renderizarListaMiembros();
            cargarMiembroEnFormulario(currentIndex);
            mostrarEstado('Integrante eliminado en memoria.', 'error');
        }
    }

    async function guardarYSubirGitHub() {
        sincronizarFormularioAMemoria();
        const token = document.getElementById('ghToken').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();

        if (!token || !repo) {
            alert('Faltan credenciales de GitHub.');
            return;
        }

        mostrarEstado('Publicando personal.json en GitHub...', 'syncing');

        try {
            const contenidoJSON = JSON.stringify(personalGlobal, null, 4);
            const utf8Bytes = new TextEncoder().encode(contenidoJSON);
            let binString = "";
            utf8Bytes.forEach((b) => { binString += String.fromCodePoint(b); });
            const contenidoB64 = btoa(binString);

            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };

            const bodyPayload = {
                message: "Actualización de personal.json desde Panel Admin",
                content: contenidoB64
            };
            if (personalFileSha) bodyPayload.sha = personalFileSha;

            const res = await fetch(`https://api.github.com/repos/${repo}/contents/personal.json`, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify(bodyPayload)
            });

            if (res.ok) {
                const dataRes = await res.json();
                personalFileSha = dataRes.content.sha;
                mostrarEstado('¡Cambios publicados con éxito en GitHub!', 'success');
                alert('¡Publicación exitosa! personal.json ha sido creado/actualizado correctamente.');
            } else {
                throw new Error('Error al actualizar archivo');
            }
        } catch (err) {
            console.error(err);
            mostrarEstado('Error al sincronizar con GitHub.', 'error');
        }
    }
</script>
