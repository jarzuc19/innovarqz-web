<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Personal | InnovArqZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-section-alt: #0b1120;
            --accent-copper: #d97706;
            --accent-copper-hover: #b45309;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 5%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo span { color: var(--accent-copper); }
        .logo small {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            border-left: 1px solid var(--border-color);
            padding-left: 0.75rem;
        }

        .github-bar {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 25px var(--shadow-color);
            flex-wrap: wrap;
        }

        .github-bar input {
            background-color: var(--bg-section-alt);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            flex-grow: 1;
            min-width: 220px;
        }

        .github-bar input:focus { border-color: var(--accent-copper); }

        .btn-primary {
            background-color: var(--accent-copper);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.3s;
            white-space: nowrap;
        }

        .btn-primary:hover { background-color: var(--accent-copper-hover); }

        .selector-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
        }

        .selector-row select {
            background-color: var(--bg-section-alt);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            min-width: 280px;
            cursor: pointer;
        }

        .selector-row select:focus { border-color: var(--accent-copper); }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--accent-copper);
            color: var(--accent-copper);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.3s;
        }

        .btn-danger:hover { background-color: var(--danger-color); color: #fff; }

        .form-section-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 15px 35px var(--shadow-color);
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .form-section-card.active-panel {
            opacity: 1;
            pointer-events: auto;
        }

        .section-header-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-copper);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .upload-dropzone {
            border: 2px dashed var(--border-color);
            background-color: var(--bg-section-alt);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: border-color 0.3s, background-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        .upload-dropzone:hover {
            border-color: var(--accent-copper);
            background-color: rgba(217, 119, 6, 0.03);
        }

        .upload-dropzone input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-img-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-copper);
            margin: 0 auto 1rem;
            background-color: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full { grid-column: span 2; }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input[type="text"], select, textarea {
            background-color: var(--bg-section-alt);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-copper);
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.2);
        }

        textarea { resize: vertical; min-height: 110px; }

        .projects-checklist {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            background-color: var(--bg-section-alt);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            max-height: 220px;
            overflow-y: auto;
        }

        .project-check-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.6rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: border-color 0.2s;
        }

        .project-check-item:hover { border-color: var(--accent-copper); }
        .project-check-item input { accent-color: var(--accent-copper); cursor: pointer; }

        .bottom-action-bar {
            position: sticky;
            bottom: 2rem;
            background-color: rgba(30, 41, 59, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px var(--shadow-color);
            z-index: 100;
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .bottom-action-bar.active-bar {
            opacity: 1;
            pointer-events: auto;
        }

        .status-feedback {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-feedback.success { color: var(--success-color); }
        .status-feedback.error { color: var(--danger-color); }
        .status-feedback.syncing { color: var(--accent-copper); }

        @media (max-width: 900px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            .projects-checklist { grid-template-columns: 1fr; }
            .github-bar { flex-direction: column; align-items: stretch; }
            .selector-row { flex-direction: column; gap: 1rem; align-items: stretch; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div>Innov<span>ArqZ</span></div>
            <small>Admin Personal</small>
        </div>
    </header>

    <div class="github-bar">
        <input type="password" id="gh_token" placeholder="GitHub Personal Access Token (ghp_...)" autocomplete="off">
        <input type="text" id="gh_repo" placeholder="Repositorio (ej. jarzuc19/innovarqz-web)">
        <button type="button" class="btn-primary" onclick="conectarYCargarGitHub()">
            <i data-lucide="cloud-download"></i> Cargar Personal y Proyectos
        </button>
    </div>

    <div class="selector-row">
        <div style="display: flex; align-items: center; gap: 1rem; flex-grow: 1;">
            <label for="miembroSelect" style="font-weight: 700; color: var(--text-main);">Profesional Activo:</label>
            <select id="miembroSelect" onchange="cambiarMiembroSeleccionado()">
                <option value="" disabled selected>-- Conecta con GitHub primero --</option>
            </select>
        </div>
        
        <div style="display: flex; gap: 0.75rem;">
            <button type="button" class="btn-secondary" onclick="crearNuevoMiembro()">
                <i data-lucide="user-plus"></i> + Nuevo Profesional
            </button>
            <button type="button" class="btn-danger" id="btnEliminarMiembro" onclick="eliminarMiembroActivo()" style="display: none;">
                <i data-lucide="trash-2"></i> Eliminar
            </button>
        </div>
    </div>

    <div class="form-section-card" id="formCard">
        <div class="section-header-title">
            <i data-lucide="user"></i> 1. Tarjeta en la Sección "Nosotros"
        </div>

        <div class="form-grid">
            <div class="form-group full">
                <label>Foto de Perfil (Se sube automáticamente al repositorio)</label>
                <div class="upload-dropzone" id="dropzoneFoto">
                    <input type="file" id="inputFileFoto" accept="image/*" onchange="subirFotoGitHub(event)">
                    <div id="previewWrapper">
                        <div class="preview-img-container" id="previewContainer">
                            <i data-lucide="camera" style="width: 32px; height: 32px; color: var(--text-muted);"></i>
                        </div>
                        <p style="font-size: 0.9rem; font-weight: 600; color: var(--text-main);">Haz clic o arrastra la foto aquí</p>
                        <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;" id="nombreArchivoFoto">Ningún archivo seleccionado</p>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>ID Único (Sin espacios, ej: james-zuniga)</label>
                <input type="text" id="m_id" placeholder="james-zuniga">
            </div>

            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="m_nombre" placeholder="Arq. James Ramiro Zúñiga Caipe">
            </div>

            <div class="form-group">
                <label>Cargo Principal (En Tarjeta)</label>
                <input type="text" id="m_cargo" placeholder="Director General & Coordinador BIM / CIM">
            </div>

            <div class="form-group">
                <label>Etiquetas en Tarjeta (Separadas por coma)</label>
                <input type="text" id="m_etiquetas" placeholder="Arq. UDENAR, buildingSMART, BIM 5D">
            </div>
        </div>

        <div class="section-header-title" style="margin-top: 2.5rem;">
            <i data-lucide="file-text"></i> 2. Detalle del Modal Dinámico
        </div>

        <div class="form-grid">
            <div class="form-group full">
                <label>Subtítulo del Modal</label>
                <input type="text" id="m_role_modal" placeholder="Fundador & Principal Manager">
            </div>

            <div class="form-group full">
                <label>Credenciales / Metadatos (Separados por coma - Salen con ícono gris en el modal)</label>
                <input type="text" id="m_credenciales" placeholder="Matrícula Profesional CPNAA, buildingSMART Certified, Nariño, Colombia">
            </div>

            <div class="form-group full">
                <label>Perfil Ejecutivo & Dirección Técnica</label>
                <textarea id="m_biografia" placeholder="Arquitecto egresado de la Universidad de Nariño..."></textarea>
            </div>

            <div class="form-group full">
                <label>Formación Académica & Certificaciones (Una por línea)</label>
                <textarea id="m_educacion" placeholder="• Arquitecto: Universidad de Nariño.&#10;• Certificación Internacional: buildingSMART..."></textarea>
            </div>
        </div>

        <div class="section-header-title" style="margin-top: 2.5rem;">
            <i data-lucide="box"></i> 3. Proyectos Asociados al Perfil
        </div>

        <div class="form-group full">
            <label>Selecciona los proyectos en los que participó este profesional:</label>
            <div class="projects-checklist" id="proyectosChecklistContainer">
                <span style="color: var(--text-muted); font-size: 0.88rem;">Conecta con GitHub para listar los proyectos disponibles.</span>
            </div>
        </div>
    </div>

    <div class="bottom-action-bar" id="bottomBar">
        <div class="status-feedback" id="statusFeedback">
            <i data-lucide="info"></i> <span>Listo para sincronizar</span>
        </div>
        <button type="button" class="btn-primary" onclick="guardarYSubirGitHub()" style="padding: 0.85rem 2rem; font-size: 1rem;">
            <i data-lucide="cloud-upload"></i> Guardar y Subir a GitHub
        </button>
    </div>

<script>
    let personalGlobal = [];
    let proyectosGlobales = [];
    let personalFileSha = null;
    let indiceActivo = -1;

    document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) lucide.createIcons();
        document.getElementById('gh_token').value = localStorage.getItem('gh_token_pers') || '';
        document.getElementById('gh_repo').value = localStorage.getItem('gh_repo_pers') || 'jarzuc19/innovarqz-web';
    });

    function guardarCredenciales() {
        localStorage.setItem('gh_token_pers', document.getElementById('gh_token').value.trim());
        localStorage.setItem('gh_repo_pers', document.getElementById('gh_repo').value.trim());
    }

    function actualizarEstado(mensaje, tipo) {
        const feedback = document.getElementById('statusFeedback');
        feedback.className = `status-feedback ${tipo}`;
        
        let icon = 'info';
        if (tipo === 'success') icon = 'check-circle';
        if (tipo === 'error') icon = 'alert-triangle';
        if (tipo === 'syncing') icon = 'refresh-cw';

        feedback.innerHTML = `<i data-lucide="${icon}"></i> <span>${mensaje}</span>`;
        if (window.lucide) lucide.createIcons();
    }

    // Decodificador UTF-8 robusto compatible con tildes y eñes desde la API de GitHub
    function decodeBase64UTF8(base64) {
        const binString = atob(base64);
        const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
        return new TextDecoder().decode(bytes);
    }

    async function conectarYCargarGitHub() {
        guardarCredenciales();
        const token = document.getElementById('gh_token').value.trim();
        const repo = document.getElementById('gh_repo').value.trim();

        if (!token || !repo) {
            alert('Por favor ingresa tu Token de GitHub y el Repositorio.');
            return;
        }

        actualizarEstado('Conectando con GitHub...', 'syncing');

        try {
            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            };

            // 1. Cargar proyectos.json
            const resProj = await fetch(`https://api.github.com/repos/${repo}/contents/proyectos.json`, { headers });
            if (resProj.ok) {
                const dataProj = await resProj.json();
                const contenidoProj = decodeBase64UTF8(dataProj.content);
                proyectosGlobales = JSON.parse(contenidoProj);
                renderizarCheckboxesProyectos();
            } else {
                proyectosGlobales = [];
            }

            // 2. Cargar personal.json
            const resPers = await fetch(`https://api.github.com/repos/${repo}/contents/personal.json`, { headers });
            if (resPers.ok) {
                const dataPers = await resPers.json();
                personalFileSha = dataPers.sha;
                const contenidoPers = decodeBase64UTF8(dataPers.content);
                personalGlobal = JSON.parse(contenidoPers);
            } else {
                personalGlobal = [];
                personalFileSha = null;
            }

            poblarSelectMiembros();

            document.getElementById('formCard').classList.add('active-panel');
            document.getElementById('bottomBar').classList.add('active-bar');

            if (personalGlobal.length > 0) {
                seleccionarMiembroPorIndex(0);
            } else {
                crearNuevoMiembro();
            }

            actualizarEstado('Conectado y sincronizado con éxito', 'success');

        } catch (err) {
            console.error(err);
            actualizarEstado('Error al conectar con GitHub', 'error');
        }
    }

    function renderizarCheckboxesProyectos() {
        const container = document.getElementById('proyectosChecklistContainer');
        if (!container) return;

        if (proyectosGlobales.length === 0) {
            container.innerHTML = '<span style="color:var(--text-muted); font-size:0.88rem;">No se encontraron proyectos en el repositorio.</span>';
            return;
        }

        container.innerHTML = '';
        proyectosGlobales.forEach(p => {
            const label = document.createElement('label');
            label.className = 'project-check-item';
            label.innerHTML = `
                <input type="checkbox" value="${p.id}" class="chk-proyecto">
                <span><strong>${p.title}</strong> (${p.year || '2026'})</span>
            `;
            container.appendChild(label);
        });
    }

    function poblarSelectMiembros() {
        const select = document.getElementById('miembroSelect');
        select.innerHTML = '';

        personalGlobal.forEach((m, idx) => {
            const option = document.createElement('option');
            option.value = idx;
            option.textContent = m.nombre || `Profesional ${idx + 1} (${m.id})`;
            select.appendChild(option);
        });
    }

    function cambiarMiembroSeleccionado() {
        const select = document.getElementById('miembroSelect');
        const idx = parseInt(select.value, 10);
        if (!isNaN(idx)) {
            seleccionarMiembroPorIndex(idx);
        }
    }

    function seleccionarMiembroPorIndex(idx) {
        indiceActivo = idx;
        const m = personalGlobal[idx];
        if (!m) return;

        document.getElementById('miembroSelect').value = idx;
        document.getElementById('m_id').value = m.id || '';
        document.getElementById('m_nombre').value = m.nombre || '';
        document.getElementById('m_cargo').value = m.cargo || '';
        document.getElementById('m_etiquetas').value = (m.etiquetas || []).join(', ');
        document.getElementById('m_role_modal').value = m.role_modal || '';
        document.getElementById('m_credenciales').value = (m.credenciales || []).join(', ');
        document.getElementById('m_biografia').value = m.biografia || '';
        document.getElementById('m_educacion').value = m.educacion || '';

        const asoc = m.proyectosAsociados || [];
        document.querySelectorAll('.chk-proyecto').forEach(chk => {
            chk.checked = asoc.includes(chk.value);
        });

        const container = document.getElementById('previewContainer');
        const labelArchivo = document.getElementById('nombreArchivoFoto');
        if (m.foto) {
            container.innerHTML = `<img src="${m.foto}" alt="Foto perfil">`;
            labelArchivo.textContent = m.foto;
            container.dataset.fotoActual = m.foto;
        } else {
            container.innerHTML = `<i data-lucide="camera" style="width: 32px; height: 32px; color: var(--text-muted);"></i>`;
            labelArchivo.textContent = 'Ningún archivo seleccionado';
            container.dataset.fotoActual = '';
        }

        document.getElementById('btnEliminarMiembro').style.display = 'inline-flex';
        if (window.lucide) lucide.createIcons();
    }

    function crearNuevoMiembro() {
        indiceActivo = -1;
        document.getElementById('miembroSelect').value = "";
        document.getElementById('m_id').value = '';
        document.getElementById('m_nombre').value = '';
        document.getElementById('m_cargo').value = '';
        document.getElementById('m_etiquetas').value = '';
        document.getElementById('m_role_modal').value = '';
        document.getElementById('m_credenciales').value = '';
        document.getElementById('m_biografia').value = '';
        document.getElementById('m_educacion').value = '';

        document.querySelectorAll('.chk-proyecto').forEach(chk => chk.checked = false);

        const container = document.getElementById('previewContainer');
        container.innerHTML = `<i data-lucide="camera" style="width: 32px; height: 32px; color: var(--text-muted);"></i>`;
        container.dataset.fotoActual = '';
        document.getElementById('nombreArchivoFoto').textContent = 'Ningún archivo seleccionado';
        document.getElementById('inputFileFoto').value = '';

        document.getElementById('btnEliminarMiembro').style.display = 'none';
        if (window.lucide) lucide.createIcons();
        document.getElementById('m_id').focus();
    }

    function eliminarMiembroActivo() {
        if (indiceActivo > -1) {
            if (confirm('¿Estás seguro de eliminar este profesional de la lista?')) {
                personalGlobal.splice(indiceActivo, 1);
                poblarSelectMiembros();
                
                if (personalGlobal.length > 0) {
                    seleccionarMiembroPorIndex(0);
                } else {
                    crearNuevoMiembro();
                }
                actualizarEstado('Perfil eliminado en memoria. Recuerda guardar en GitHub.', 'error');
            }
        }
    }

    async function subirFotoGitHub(event) {
        const file = event.target.files[0];
        if (!file) return;

        const token = document.getElementById('gh_token').value.trim();
        const repo = document.getElementById('gh_repo').value.trim();
        const nombreArchivo = file.name.replace(/\s+/g, '-').toLowerCase();

        actualizarEstado(`Subiendo foto ${nombreArchivo}...`, 'syncing');

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64Completo = e.target.result;
            const base64Data = base64Completo.split(',')[1];

            try {
                const headers = {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                };

                let shaExistente = null;
                const checkRes = await fetch(`https://api.github.com/repos/${repo}/contents/${nombreArchivo}`, { headers });
                if (checkRes.ok) {
                    const checkData = await checkRes.json();
                    shaExistente = checkData.sha;
                }

                const bodyPayload = {
                    message: `Subida de foto perfil: ${nombreArchivo}`,
                    content: base64Data
                };
                if (shaExistente) bodyPayload.sha = shaExistente;

                const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${nombreArchivo}`, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify(bodyPayload)
                });

                if (putRes.ok) {
                    document.getElementById('previewContainer').innerHTML = `<img src="${base64Completo}" alt="Foto">`;
                    document.getElementById('previewContainer').dataset.fotoActual = nombreArchivo;
                    document.getElementById('nombreArchivoFoto').textContent = nombreArchivo;
                    actualizarEstado('Foto subida exitosamente al repositorio', 'success');
                } else {
                    throw new Error('Error al subir imagen a GitHub');
                }

            } catch (err) {
                console.error(err);
                actualizarEstado('Error al subir la imagen', 'error');
            }
        };
        reader.readAsDataURL(file);
    }

    async function guardarYSubirGitHub() {
        const id = document.getElementById('m_id').value.trim();
        if (!id) {
            alert('El ID Único es obligatorio.');
            document.getElementById('m_id').focus();
            return;
        }

        const token = document.getElementById('gh_token').value.trim();
        const repo = document.getElementById('gh_repo').value.trim();

        const proyectosAsoc = Array.from(document.querySelectorAll('.chk-proyecto:checked')).map(chk => chk.value);
        const fotoActual = document.getElementById('previewContainer').dataset.fotoActual || '';

        const objetoMiembro = {
            id: id,
            nombre: document.getElementById('m_nombre').value.trim(),
            cargo: document.getElementById('m_cargo').value.trim(),
            etiquetas: document.getElementById('m_etiquetas').value.split(',').map(s => s.trim()).filter(Boolean),
            role_modal: document.getElementById('m_role_modal').value.trim(),
            credenciales: document.getElementById('m_credenciales').value.split(',').map(s => s.trim()).filter(Boolean),
            biografia: document.getElementById('m_biografia').value.trim(),
            educacion: document.getElementById('m_educacion').value.trim(),
            foto: fotoActual,
            proyectosAsociados: proyectosAsoc
        };

        if (indiceActivo === -1) {
            personalGlobal.push(objetoMiembro);
            indiceActivo = personalGlobal.length - 1;
        } else {
            personalGlobal[indiceActivo] = objetoMiembro;
        }

        poblarSelectMiembros();
        document.getElementById('miembroSelect').value = indiceActivo;

        actualizarEstado('Subiendo personal.json a GitHub...', 'syncing');

        try {
            const contenidoJSON = JSON.stringify(personalGlobal, null, 4);
            const utf8Bytes = new TextEncoder().encode(contenidoJSON);
            let binString = "";
            utf8Bytes.forEach((b) => { binString += String.fromCodePoint(b); });
            const contenidoB64 = btoa(binString);

            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };

            const bodyPayload = {
                message: "Actualización de personal.json desde Admin Personal",
                content: contenidoB64
            };
            if (personalFileSha) bodyPayload.sha = personalFileSha;

            const res = await fetch(`https://api.github.com/repos/${repo}/contents/personal.json`, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify(bodyPayload)
            });

            if (res.ok) {
                const dataRes = await res.json();
                personalFileSha = dataRes.content.sha;
                actualizarEstado('¡Cambios guardados y subidos a GitHub con éxito!', 'success');
            } else {
                throw new Error('Error al actualizar personal.json');
            }

        } catch (err) {
            console.error(err);
            actualizarEstado('Error al subir los cambios a GitHub', 'error');
        }
    }
</script>
