<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Digital | InnovArqZ Soluciones Integrales & Arq. James R. Zúñiga</title>
    
    <meta property="og:title" content="Portafolio Digital | InnovArqZ Soluciones Integrales">
    <meta property="og:description" content="Casos de estudio, consultorías e intervenciones técnicas en Arquitectura, Ingeniería y BIM/CIM.">
    <meta property="og:image" content="https://www.innovarqzsas.com/esencia-digital-innovarqz.jpg">
    <meta property="og:url" content="https://www.innovarqzsas.com/portafolio">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-section-alt: #0b1120;
            --accent-copper: #d97706;
            --accent-copper-hover: #b45309;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --whatsapp-color: #25d366;
            --header-bg: rgba(15, 23, 42, 0.92);
            --modal-bg: #1e293b;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        body.light-mode {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --bg-section-alt: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --header-bg: rgba(248, 250, 252, 0.94);
            --modal-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* -------------------------------------------
           1. BARRA DE NAVEGACIÓN SUPERIOR
           ------------------------------------------- */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
        }

        .brand-logo {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-title {
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: -0.6px;
            color: var(--text-main);
        }

        .brand-title span { color: var(--accent-copper); }

        .brand-subtitle {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-nav-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-nav-link:hover { color: var(--accent-copper); }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-copper);
            color: var(--accent-copper);
            transform: scale(1.05);
        }

        /* -------------------------------------------
           2. HERO EDITORIAL DUAL ("MONEDA DE 2 CARAS")
           ------------------------------------------- */
        .hero-dual-section {
            padding: 3.5rem 5% 2rem;
            max-width: 1250px;
            margin: 0 auto;
            width: 100%;
        }

        .face-selector-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2.5rem;
        }

        .face-selector-pill {
            display: inline-flex;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 40px;
            box-shadow: 0 8px 25px var(--shadow-color);
        }

        .face-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.65rem 1.6rem;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .face-btn.active {
            background-color: var(--accent-copper);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
        }

        .hero-editorial-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.25fr 0.95fr;
            box-shadow: 0 20px 45px var(--shadow-color);
            position: relative;
        }

        .hero-editorial-body {
            padding: 3.5rem 3.5rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-tagline-badge {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-copper);
            margin-bottom: 0.85rem;
        }

        .hero-big-title {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.08;
            letter-spacing: -1.2px;
            color: var(--text-main);
            margin-bottom: 1.25rem;
            text-transform: uppercase;
        }

        .hero-desc-lead {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 2rem;
            max-width: 580px;
        }

        .hero-kpi-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.2rem;
            padding-top: 1.75rem;
            border-top: 1px solid var(--border-color);
        }

        .kpi-unit {
            display: flex;
            flex-direction: column;
        }

        .kpi-number {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1.1;
        }

        .kpi-number span { color: var(--accent-copper); }

        .kpi-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 3px;
        }

        .hero-editorial-visual {
            position: relative;
            background-color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-left: 1px solid var(--border-color);
        }

        .hero-editorial-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .hero-visual-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(15, 23, 42, 0.7) 100%);
            pointer-events: none;
        }

        /* -------------------------------------------
           3. FILTROS, BUSCADOR Y RETÍCULA 3x3
           ------------------------------------------- */
        .portfolio-main-area {
            padding: 3rem 5% 5rem;
            max-width: 1250px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .controls-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .search-pill-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 0.45rem 1.2rem;
            flex-grow: 1;
            max-width: 420px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .search-pill-wrapper:focus-within {
            border-color: var(--accent-copper);
            box-shadow: 0 0 15px rgba(217, 119, 6, 0.2);
        }

        .search-pill-wrapper input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.9rem;
            width: 100%;
            margin-left: 0.6rem;
        }

        .category-filter-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .cat-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.45rem 1.1rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: var(--accent-copper);
            color: #ffffff;
            border-color: var(--accent-copper);
        }

        /* RETÍCULA 3x3 */
        .projects-grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            min-height: 480px;
        }

        .project-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            box-shadow: 0 10px 25px var(--shadow-color);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-copper);
            box-shadow: 0 16px 35px rgba(217, 119, 6, 0.25);
        }

        .card-cover-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        .card-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .project-card:hover .card-cover-img {
            transform: scale(1.06);
        }

        .card-placeholder-box {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--accent-copper);
            opacity: 0.5;
            background: linear-gradient(135deg, var(--bg-card), var(--bg-dark));
        }

        .card-year-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-color);
            color: var(--accent-copper);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 6px;
            backdrop-filter: blur(6px);
        }

        .card-body {
            padding: 1.35rem 1.4rem 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-meta-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 0.65rem;
        }

        .meta-tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            background-color: rgba(217, 119, 6, 0.12);
            color: var(--accent-copper);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 800;
            line-height: 1.3;
            color: var(--text-main);
            margin-bottom: 0.4rem;
        }

        .card-subtitle {
            font-size: 0.84rem;
            color: var(--text-muted);
            line-height: 1.45;
            margin-bottom: 1.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.85rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--accent-copper);
        }

        /* -------------------------------------------
           4. PAGINACIÓN NUMÉRICA DINÁMICA
           ------------------------------------------- */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 3.5rem;
        }

        .page-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            min-width: 40px;
            height: 40px;
            padding: 0 0.8rem;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--accent-copper);
            color: var(--accent-copper);
        }

        .page-btn.active {
            background-color: var(--accent-copper);
            border-color: var(--accent-copper);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
        }

        .page-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* -------------------------------------------
           5. BANNER DE CONVERSIÓN Y PIE DE PÁGINA
           ------------------------------------------- */
        .cta-banner-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 2.8rem 3.5rem;
            display: grid;
            grid-template-columns: 1.4fr auto 1fr;
            gap: 3rem;
            align-items: center;
            margin-bottom: 4rem;
            box-shadow: 0 20px 45px var(--shadow-color);
        }

        .cta-left h3 {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .cta-left h3 span { color: var(--accent-copper); }

        .cta-left p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .cta-divider {
            width: 1px;
            height: 100%;
            min-height: 90px;
            background-color: var(--border-color);
        }

        .cta-right {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            align-items: flex-end;
        }

        .btn-whatsapp-cta {
            background-color: var(--whatsapp-color);
            color: #ffffff;
            padding: 0.85rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.25);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-whatsapp-cta:hover {
            transform: translateY(-2px);
            background-color: #1da851;
        }

        footer {
            background-color: var(--bg-section-alt);
            border-top: 1px solid var(--border-color);
            padding: 3rem 5% 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-grid {
            max-width: 1250px;
            margin: 0 auto 2.5rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 3rem;
        }

        .footer-col strong {
            color: var(--text-main);
            font-size: 0.95rem;
            display: block;
            margin-bottom: 0.75rem;
        }

        .footer-col p { line-height: 1.6; }

        .footer-col a {
            color: var(--accent-copper);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-bottom-bar {
            max-width: 1250px;
            margin: 0 auto;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
        }

        /* -------------------------------------------
           6. MODALES Y VISOR LIGHTBOX HEREDADOS
           ------------------------------------------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 3500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 5%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 2.5rem;
            box-shadow: 0 25px 50px var(--shadow-color);
        }

        .modal-close {
